server:
  port: 18080

spring:
  application:
    name: ecr-docker-cli-pull-demo

management:
  endpoints:
    web:
      exposure:
        include: health,info

demo:
  aws:
    ecr:
      # AWS SDK ECR API timeout (초)
      api-call-attempt-timeout-seconds: 10
      api-call-timeout-seconds: 15
      max-retry-attempts: 3
