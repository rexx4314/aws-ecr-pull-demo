server:
  port: 18080

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

demo:
  aws:
    ecr:
      # AWS SDK v2 client timeout/retry (EcrClientFactory에서 사용)
      api-call-attempt-timeout-seconds: 10
      api-call-timeout-seconds: 15
      max-retry-attempts: 3

app:
  download:
    # 기본 출력 폴더
    baseDir: "./out"

    # 레이어 다운로드 동시성
    defaultConcurrency: 4
    maxConcurrency: 5

    # HTTP GET streaming
    httpTimeoutSeconds: 180

    # 레이어 다운로드 재시도 횟수
    maxRetries: 4

    # BlobDownloader 백오프
    backoffBaseMillis: 300
    backoffMaxMillis: 5000

  scan:
    # resolveLatest / repo scan 시 스캔 상한(과금/지연 방어)
    defaultMaxPages: 50
    defaultMaxImages: 2000
